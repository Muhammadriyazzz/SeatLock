spring.application.name=seatlock
spring.port=8000

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=seatlock_db;encrypt=true;trustServerCertificate=true
Spring.datasource.username=riyaz
Spring.datasource.password=${password:your_db_password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl.auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


app.jwt.secret=change-this-to-a-long-random-secret-key-min-32-chars
app.jwt.expiration-ms=86400000

app.seat-lock.duration-minutes=5
app.seat-lock.cleanup-interval-ms=60000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html